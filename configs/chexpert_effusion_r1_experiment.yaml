# R1-Onevision-7B Configuration for CheXpert Pleural Effusion Calibration Study
# More balanced condition (~24% prevalence) to complement Pneumonia (3.4%)
experiment_name: chexpert_effusion_r1

data:
  dataset_type: chexpert
  metadata_path: /path/to/chexpert/train_valid_combined.csv
  images_dir: /path/to/chexpert/images
  random_seed: 42
  demographic_groups:
    male:
      - Male
    female:
      - Female
  condition: Pleural Effusion

model:
  name: r1-onevision-7b
  max_tokens: 4096
  timeout: 120.0
  rate_limit_rpm: 999

confidence:
  extract_logprob: true
  extract_verbalized: true
  extract_self_consistency: true
  extract_embedding_consistency: false
  self_consistency_k: 15
  self_consistency_temperatures:
    - 0.5
    - 1.0
  logprob_top_k: 5

calibration:
  n_bins: 10
  bootstrap_n_samples: 1000
  bootstrap_ci_level: 0.95
  temperature_scaling_lr: 0.01
  temperature_scaling_max_iter: 100

output:
  output_dir: outputs
  save_raw_predictions: true
  generate_figures: true
  figure_format: png
  figure_dpi: 300
