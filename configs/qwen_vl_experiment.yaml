# Qwen2.5-VL-7B-Instruct Configuration for DDI Calibration Study
experiment_name: qwen_vl_ddi_calibration

data:
  metadata_path: /path/to/ddi/ddi_metadata.csv
  images_dir: /path/to/ddi/
  random_seed: 42
  skin_tone_groups:
    light:
      - 12
    medium:
      - 34
    dark:
      - 56

model:
  name: qwen2.5-vl-7b
  max_tokens: 256
  timeout: 120.0
  rate_limit_rpm: 999

confidence:
  extract_logprob: true
  extract_verbalized: true
  extract_self_consistency: true
  extract_embedding_consistency: false
  self_consistency_k: 15
  self_consistency_temperatures:
    - 0.5
    - 1.0
  logprob_top_k: 5

calibration:
  n_bins: 10
  bootstrap_n_samples: 1000
  bootstrap_ci_level: 0.95
  temperature_scaling_lr: 0.01
  temperature_scaling_max_iter: 100

output:
  output_dir: outputs
  save_raw_predictions: true
  generate_figures: true
  figure_format: png
  figure_dpi: 300
