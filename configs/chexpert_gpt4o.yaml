# GPT-4o Configuration for CheXpert Pneumonia Calibration Study
experiment_name: chexpert_pneumonia_gpt4o

data:
  dataset_type: chexpert
  metadata_path: /path/to/chexpert/train_valid_combined.csv
  images_dir: /path/to/chexpert/images
  random_seed: 42
  demographic_groups:
    male:
      - Male
    female:
      - Female
  condition: Pneumonia

model:
  name: gpt-4o
  max_tokens: 256
  timeout: 60.0
  rate_limit_rpm: 60

confidence:
  extract_logprob: true          # TLP: token-level probability
  extract_verbalized: true       # CE: confidence elicitation
  extract_self_consistency: true  # Label agreement across K samples
  extract_embedding_consistency: false  # Not needed for non-reasoning models
  self_consistency_k: 15
  self_consistency_temperatures:
    - 0.5
    - 1.0
  embedding_model: text-embedding-3-small
  logprob_top_k: 5

calibration:
  n_bins: 10
  bootstrap_n_samples: 1000
  bootstrap_ci_level: 0.95
  temperature_scaling_lr: 0.01
  temperature_scaling_max_iter: 100

output:
  output_dir: outputs
  save_raw_predictions: true
  generate_figures: true
  figure_format: png
  figure_dpi: 300
